name: "Build Assets"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify the committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- resources/dist; then
            echo "::error::resources/dist is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
